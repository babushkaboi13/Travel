{% extends 'main/base.html' %}
{% block title %}Оплата{% endblock %}
{% block content %}
<h1>Оплата бронирования</h1>
<div class="card" style="max-width:600px;">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="margin-top:10px;">
      <button type="submit" class="btn">Оплатить</button>
      <a href="{% url 'main:profile' %}" class="btn" style="background:#ddd;color:#333;margin-left:10px;">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
